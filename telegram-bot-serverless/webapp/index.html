<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>My notes</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <header><span class="eyebrow">A LITTLE SPACE TO REMEMBER</span><h1>My notes<span>.</span></h1>
      <p>Your thoughts, tasks, and things for later.</p></header>
    <div class="summary" aria-label="Note statistics">
      <div><strong id="open-count">—</strong><span>To do</span></div>
      <div><strong id="done-count">—</strong><span>Completed</span></div>
      <div><strong id="total-count">—</strong><span>Total notes</span></div>
    </div>
    <form id="add-form">
      <label for="note-body">Something to remember?</label>
      <textarea id="note-body" maxlength="200" rows="2" placeholder="Pick up coffee on the way home…" required></textarea>
      <div class="form-footer"><span id="char-count">0 / 200</span><button id="save" type="submit">Add note <span aria-hidden="true">↗</span></button></div>
    </form>
    <div class="list-heading"><h2>Your latest notes</h2><button id="refresh" type="button" class="quiet">Refresh</button></div>
    <p id="status" role="status" aria-live="polite">Loading your notes…</p>
    <ul id="notes" aria-label="Your notes"></ul>
    <p id="empty" hidden>Nothing here yet. Save your first note above.</p>
    <footer>Your 10 newest notes · Shared with your private bot chat</footer>
  </main>
</body>
</html>
