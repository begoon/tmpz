{{ template "base" . }} {{ define "content" }}
<h1 class="title">HTML!</h1>
<a class="corner-link left" href="/static/IMG_3751-square.jpeg">IMG_3751-square.jpeg</a>
<a class="corner-link right" href="/static/r-tape-loading-error.gif">r-tape-loading-error.gif</a>

<input
    class="search"
    type="search"
    name="q"
    value="{{ .Query }}"
    placeholder="filter by name"
    autocomplete="off"
    autofocus
    hx-get="/variables"
    hx-trigger="input changed delay:1s, search"
    hx-target="#vars"
/>

<table>
    <tbody id="vars">
        {{ template "vars" . }}
    </tbody>
</table>

{{ end }}
