[project]
name = "ec2-instance-id"
version = "0.1.0"
description = "Print the EC2 instance ID via IMDSv2"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Alexander Demin", email = "alexander.demin@iproov.com" }]

[project.scripts]
ec2-instance-id = "ec2_instance_id:main"
instance-id = "ec2_instance_id:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
